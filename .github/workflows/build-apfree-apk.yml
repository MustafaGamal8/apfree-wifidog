name: Build Apfree WiFiDog APK

on:
  workflow_dispatch:
  push:
    paths:
      - "package/apfree-wifidog/**"
      - ".github/workflows/build-openwrt-apk.yml"

jobs:
  build:
    name: OpenWrt 25.12.6 x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build package
        uses: nooblk-98/openwrt-package-compile-action@v1
        with:
          package-name: apfree-wifidog
          package-dir: package/apfree-wifidog
          sdk-version: "25.12.6"
          sdk-target: x86
          sdk-subtarget: "64"
          sdk-url-override: https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          artifact-name: apfree-wifidog-openwrt-25.12.6-x86-64
          retention-days: 14
          make-jobs: "2"
